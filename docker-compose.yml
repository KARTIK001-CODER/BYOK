services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragforge"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ragforge_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragforge_backend
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - APP_NAME=RAGForge
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ragforge
      - LOG_LEVEL=INFO
      - LOG_FORMAT=text
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ragforge_network

volumes:
  pgdata:
    driver: local

networks:
  ragforge_network:
    driver: bridge
